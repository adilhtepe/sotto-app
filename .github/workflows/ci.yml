name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel --target sotto vban_send vban_recv
      - name: Smoke test (null device, real UDP)
        shell: bash
        run: sh smoke.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: sotto-${{ runner.os }}
          path: |
            build/sotto
            build/Release/sotto.exe
          if-no-files-found: ignore
